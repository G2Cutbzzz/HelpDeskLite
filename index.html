<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpDesk Lite</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <div class="container header-container">
      <h1 class="logo">HelpDesk Lite</h1>
      <button id="btn-toggle-modal" class="btn btn-primary">+ Nuevo Ticket</button>
    </div>
  </header>

  <main class="container main-content">
    <!-- Dashboard de Métricas -->
    <section class="dashboard" aria-label="Métricas de soporte">
      <div class="kpi-card">
        <h3>TOTAL</h3>
        <p id="kpi-total" class="kpi-value">0</p>
      </div>
      <div class="kpi-card">
        <h3>NUEVOS</h3>
        <p id="kpi-new" class="kpi-value">0</p>
      </div>
      <div class="kpi-card">
        <h3>PROCESO</h3>
        <p id="kpi-in-progress" class="kpi-value">0</p>
      </div>
      <div class="kpi-card">
        <h3>RESUELTOS</h3>
        <p id="kpi-resolved" class="kpi-value">0</p>
      </div>
    </section>

    <!--FIltro-->
    <section class="controls" aria-label="Búsqueda y filtros">
      <div class="search-box">
        <label for="search-input">Buscar</label>
        <input type="search" id="search-input" placeholder="Buscar por folio, título o detalle...">
      </div>

      <div class="filters">
        <div class="filter-group">
          <span>Estado:</span>
          <div class="status-filters" id="status-filter-container">
            <button class="filter-btn active" data-status="Todos">Todos</button>
            <button class="filter-btn" data-status="Nuevo">Nuevo</button>
            <button class="filter-btn" data-status="En proceso">Proceso</button>
            <button class="filter-btn" data-status="Resuelto">Resuelto</button>
            <button class="filter-btn" data-status="Cerrado">Cerrado</button>
            <button class="filter-btn" data-status="Cancelado">Cancelado</button>
          </div>
        </div>

        <div class="filter-group">
          <label for="priority-filter">Prioridad:</label>
          <select id="priority-filter">
            <option value="Todas">Todas</option>
            <option value="Baja">Baja</option>
            <option value="Media">Media</option>
            <option value="Alta">Alta</option>
            <option value="Crítica">Crítica</option>
          </select>
        </div>
      </div>
    </section>

        <!--Tickets-->

    <section class="tickets-section">
      <div id="tickets-container" class="tickets-grid"></div>
      <div id="empty-state" class="empty-state hidden">
        <p>No se encontraron tickets registrados o coincidentes con los filtros.</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 HelpDesk Lite - Cesar Cutberto FIMEE</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
